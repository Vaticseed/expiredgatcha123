name: Set Admin
on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username (the part before @dodgelist.local)'
        required: true
      remove:
        description: 'Remove admin instead of adding'
        type: boolean
        default: false

jobs:
  set-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/add-admin.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_USERNAME: ${{ inputs.username }}
          REMOVE: ${{ inputs.remove }}
