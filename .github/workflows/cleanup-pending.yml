name: Cleanup Pending
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Only delete pending entries from the last N hours (0 = all pending)'
        default: '0'
      match:
        description: 'Only delete pending entries whose username matches this (e.g. ^ExtremeUser_). Empty = all'
        default: ''
      dry_run:
        description: 'Dry run: only list what would be deleted'
        type: boolean
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/cleanup-pending.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOURS: ${{ inputs.hours }}
          MATCH: ${{ inputs.match }}
          DRY_RUN: ${{ inputs.dry_run }}
